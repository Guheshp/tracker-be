steps:
  # 1. Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/gcp-learning-506406/tracker-images/tracker-backend:$COMMIT_SHA"
      - "."

  # 2. Push Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/gcp-learning-506406/tracker-images/tracker-backend:$COMMIT_SHA"

images:
  - "asia-south1-docker.pkg.dev/gcp-learning-506406/tracker-images/tracker-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
